<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>连词成句练习</title>
  <!-- 引入样式表 -->
  <link rel="stylesheet" href="style.css">
  <!-- 外部依赖库：LZ-String解压库、SortableJS拖拽库、Confetti烟花库 -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="title-group">
        <h1>连词成句练习</h1>
        <p>拖动方块或依次点击两词对调位置，句号固定在句末</p>
      </div>
      <div class="user-panel">
        <div class="student-select-wrap">
          <label for="student-select">学生：</label>
          <select id="student-select">
            <option value="">-- 请选择姓名 --</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main id="questions-list">
    <!-- 题目卡片通过 script.js 动态生成 -->
  </main>

  <div class="actions-footer">
    <button class="btn-submit" id="submit-btn" onclick="submitExam()">交卷并保存成绩</button>
  </div>

  <div id="status-toast"></div>

  <!-- 引入主逻辑脚本 -->
  <script src="script.js"></script>
</body>
</html>
