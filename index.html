<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>连词成句练习</title>
  <!-- 引入外部样式 -->
  <link rel="stylesheet" href="style.css">
  <!-- 引入第三方脚本库 -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="title-group">
        <h1>连词成句练习</h1>
        <p>拖动方块或依次点击两词互换位置</p>
      </div>
      <div class="user-panel">
        <div class="student-select-wrap">
          <label for="student-select">学生：</label>
          <select id="student-select">
            <option value="">-- 请选择姓名 --</option>
          </select>
        </div>
        <a href="admin.html" class="btn-admin" title="制作自己的练习">
          ✏️ 制作自己的练习
        </a>
      </div>
    </div>
  </header>

  <main>
    <div id="questions-list">
      <div style="text-align:center; padding: 40px; color:#64748b;">正在载入题目...</div>
    </div>
  </main>

  <div class="actions-footer">
    <button class="btn-submit" id="submit-btn" onclick="submitExam()">交卷并保存成绩</button>
  </div>

  <div id="status-toast"></div>

  <!-- 引入独立的业务脚本 -->
  <script src="script.js"></script>
</body>
</html>
